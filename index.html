<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오양 듀오 돌림판</title>
  <meta name="description" content="오양 듀오 추석 돌림판">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="꽝 없는 뽑기하고 추석 선물 50개 받기">
  <meta property="og:description" content="최대 550만원 오양 듀오까지 나와요">
  <meta property="og:url" content="https://oyang-duo.github.io/oyang-duo-wheel/">
  <meta property="og:image" content="https://oyang-duo.github.io/oyang-duo-wheel/images/preview.png">

  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <video class="background-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="video-shade" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <h1>오양 듀오 돌림판</h1>
    </header>

    <section class="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="760" height="760" aria-label="오양 듀오 돌림판"></canvas>
        <button id="spinButton" class="spin-button" type="button">돌리기</button>
      </div>
    </section>
  </main>

  <div id="resultOverlay" class="overlay hidden" aria-hidden="true">
    <div class="result-wrap">
      <button id="closeOverlay" class="close-button" type="button" aria-label="닫기">×</button>
      <div id="floatingArea" class="floating-area"></div>
      <div id="resultContent" class="result-content"></div>
      <button id="retryButton" class="retry-button" type="button">다시 돌리기</button>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
